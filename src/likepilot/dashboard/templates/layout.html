<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikePilot Control</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('brand_asset', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('brand_asset', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('brand_asset', filename='favicon-16x16.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('brand_asset', filename='apple-touch-icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='console-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='workspace-pages.css') }}">
    <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
    <style>
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            pointer-events: none;
        }
        .notification-container > * {
            pointer-events: auto;
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}page-agents{% endblock %}">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="notification-container" id="notification-container" aria-live="polite" aria-atomic="false"></div>
    <div class="app-shell" id="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-inner">
                <button type="button" id="sidebar-collapse-btn" class="sidebar-collapse" title="Collapse navigation"
                    aria-label="Collapse navigation">
                    <span class="collapse-icon">◂</span>
                </button>

                <div class="brand-block">
                    <div class="brand-mark" aria-hidden="true">
                        <img src="{{ url_for('brand_asset', filename='192x192.png') }}" class="brand-mark-image" alt="">
                    </div>
                    <div class="brand-copy">
                            <div class="brand-title">LikePilot</div>
                    </div>
                </div>

                <nav class="nav-group" aria-label="Primary">
                    <a href="/dashboard" class="nav-link {% if page == 'dashboard' %}active{% endif %}"><span class="nav-icon">▦</span><span class="nav-copy"><span class="nav-title">Overview</span></span></a>
                    <a href="/agents" class="nav-link {% if page == 'agents' %}active{% endif %}"><span class="nav-icon">◉</span><span class="nav-copy"><span class="nav-title">Agents</span></span></a>
                    <a href="/analytics" class="nav-link {% if page == 'analytics' %}active{% endif %}"><span class="nav-icon">⌁</span><span class="nav-copy"><span class="nav-title">Analytics</span></span></a>
                    <a href="/settings/browser" class="nav-link {% if page == 'settings' %}active{% endif %}"><span class="nav-icon">⚙</span><span class="nav-copy"><span class="nav-title">Settings</span></span></a>
                    <div class="nav-subgroup {% if page == 'settings' %}nav-subgroup-active{% endif %}">
                        <a href="/settings/browser" class="nav-sublink {% if settings_view == 'browser' %}active{% endif %}">Browser</a>
                        <a href="/settings/agents/new" class="nav-sublink {% if settings_view == 'create' %}active{% endif %}">Create agent</a>
                        <a href="/settings/agents/manage" class="nav-sublink {% if settings_view == 'manage' %}active{% endif %}">Manage agents</a>
                    </div>
                    <a href="/operations/database" class="nav-link {% if page == 'operations' %}active{% endif %}"><span class="nav-icon">▤</span><span class="nav-copy"><span class="nav-title">Operations</span></span></a>
                    <div class="nav-subgroup {% if page == 'operations' %}nav-subgroup-active{% endif %}">
                        <a href="/operations/database" class="nav-sublink {% if operation_view == 'database' %}active{% endif %}">Database</a>
                        <a href="/operations/logs" class="nav-sublink {% if operation_view == 'logs' %}active{% endif %}">Runtime logs</a>
                        <a href="/operations/diagnostics" class="nav-sublink {% if operation_view == 'diagnostics' %}active{% endif %}">Diagnostics</a>
                    </div>
                </nav>

                <div class="sidebar-footer">
                    <div class="theme-panel">
                        <label class="theme-panel-label" for="theme-select">
                            <span class="button-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" class="button-icon-svg">
                                    <path d="M12 4.5a7.5 7.5 0 1 0 7.5 7.5c0-.7-.1-1.4-.3-2.1-.7 1.1-1.9 1.8-3.3 1.8-2.3 0-4.2-1.9-4.2-4.2 0-1.2.5-2.3 1.4-3.1-.4-.1-.8-.1-1.1-.1Z"></path>
                                </svg>
                            </span>
                            <span id="theme-preview" class="theme-preview theme-preview-dark" aria-hidden="true"></span>
                            <span class="button-label">Theme</span>
                        </label>
                        <select id="theme-select" class="theme-select" aria-label="Select theme">
                            <option value="dark">Dark Grid</option>
                            <option value="light">Light Ops</option>
                            <option value="high-contrast">High Contrast</option>
                        </select>
                    </div>
                    <a href="/logout" class="btn-logout icon-button" id="logout-link" title="Log out" aria-label="Log out">
                        <span class="button-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" class="button-icon-svg">
                                <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"></path>
                                <path d="M14 8l5 4-5 4"></path>
                                <path d="M9 12h10"></path>
                            </svg>
                        </span>
                        <span class="button-label">Logout</span>
                    </a>
                </div>
            </div>
        </aside>

        <button type="button" class="sidebar-backdrop" id="sidebar-backdrop" aria-label="Close navigation"></button>
        <main class="main-content" id="main-content" role="main">
            <header class="topbar" role="banner">
                <div class="topbar-main">
                    <div class="topbar-heading-row">
                        <h1 class="page-title">{% block title %}{% endblock %}</h1>
                    </div>
                </div>
                <div class="topbar-meta">
                    <button type="button" class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
                    <div class="status-cluster">
                        <div id="live-updates-pill" class="meta-pill compact-pill live-pill live-pill-warning"
                            title="Live updates" aria-label="Connection status">
                            <span class="live-dot" aria-hidden="true"></span>
                            <span id="live-updates-label">Connecting</span>
                        </div>
                    </div>
                    <div id="agent-quick-switch" class="agent-quick-switch" role="navigation" aria-label="Quick agent switch">
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <div id="app-modal" class="app-modal" hidden aria-hidden="true">
        <div class="app-modal-backdrop" data-modal-close></div>
        <section class="app-modal-card" role="dialog" aria-modal="true" aria-labelledby="app-modal-title">
            <div class="app-modal-header">
                <h2 id="app-modal-title" class="section-heading">Confirm</h2>
            </div>
            <div id="app-modal-body" class="section-subtle app-modal-body"></div>
            <div class="app-modal-actions">
                <button type="button" class="btn-secondary btn-compact" id="app-modal-cancel">Cancel</button>
                <button type="button" class="btn-primary btn-compact" id="app-modal-confirm">OK</button>
            </div>
        </section>
    </div>

    <script>
        (function () {
            const storedTheme = localStorage.getItem('theme') || 'dark';
            const savedTheme = ['dark', 'light', 'high-contrast'].includes(storedTheme) ? storedTheme : 'dark';
            localStorage.setItem('theme', savedTheme);
            document.documentElement.setAttribute('data-theme', savedTheme);
            const preview = document.getElementById('theme-preview');
            if (preview) {
                preview.className = 'theme-preview theme-preview-' + savedTheme;
            }
            const select = document.getElementById('theme-select');
            if (select) {
                select.value = savedTheme;
            }
        })();

        (function () {
            const shell = document.getElementById('app-shell');
            const toggle = document.getElementById('mobile-nav-toggle');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (!shell || !toggle || !backdrop) return;
            const close = () => {
                shell.classList.remove('mobile-nav-open');
                toggle.setAttribute('aria-expanded', 'false');
                toggle.setAttribute('aria-label', 'Open navigation');
            };
            toggle.addEventListener('click', () => {
                const open = shell.classList.toggle('mobile-nav-open');
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
            });
            backdrop.addEventListener('click', close);
            shell.querySelectorAll('.nav-link,.nav-sublink').forEach((link) => link.addEventListener('click', close));
            document.addEventListener('keydown', (event) => { if (event.key === 'Escape') close(); });
        })();

        // Global notification system
        window.showNotification = function(message, type = 'info', duration = 3000) {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.style.cssText = `
                padding: 12px 16px;
                border-radius: 12px;
                background: var(--surface-strong);
                border: 1px solid var(--glass-border);
                backdrop-filter: blur(10px);
                box-shadow: var(--shadow-lg);
                color: var(--text);
                font-size: 0.85rem;
                margin-bottom: 8px;
                animation: slideIn 0.3s ease-out;
                max-width: 300px;
            `;

            const colors = {
                success: 'var(--success)',
                error: 'var(--danger)',
                warning: 'var(--warning)',
                info: 'var(--accent)'
            };

            notification.style.borderLeft = `4px solid ${colors[type] || colors.info}`;
            const row = document.createElement('div');
            row.style.cssText = 'display:flex;align-items:center;gap:8px;';
            const dot = document.createElement('span');
            dot.style.cssText = `width:8px;height:8px;border-radius:50%;background:${colors[type] || colors.info};flex-shrink:0;`;
            const label = document.createElement('span');
            label.textContent = String(message ?? '');
            row.append(dot, label);
            notification.appendChild(row);

            container.appendChild(notification);

            if (duration > 0) {
                setTimeout(() => {
                    notification.style.animation = 'fadeOut 0.3s ease-out';
                    setTimeout(() => notification.remove(), 300);
                }, duration);
            }

            return notification;
        };

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registered successfully');

                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    showNotification('New version available! Refresh to update.', 'info', 10000);
                                }
                            });
                        });
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }

        // Performance monitoring
        if ('performance' in window && 'PerformanceObserver' in window) {
            // Monitor Largest Contentful Paint (LCP)
            const lcpObserver = new PerformanceObserver(list => {
                const entries = list.getEntries();
                const lastEntry = entries[entries.length - 1];
                console.log('LCP:', lastEntry.startTime);
            });
            lcpObserver.observe({ entryTypes: ['largest-contentful-paint'] });

            // Monitor First Input Delay (FID)
            const fidObserver = new PerformanceObserver(list => {
                const entries = list.getEntries();
                entries.forEach(entry => {
                    console.log('FID:', entry.processingStart - entry.startTime);
                });
            });
            fidObserver.observe({ entryTypes: ['first-input'] });

            // Monitor Cumulative Layout Shift (CLS)
            let clsValue = 0;
            const clsObserver = new PerformanceObserver(list => {
                const entries = list.getEntries();
                entries.forEach(entry => {
                    if (!entry.hadRecentInput) {
                        clsValue += entry.value;
                    }
                });
                console.log('CLS:', clsValue);
            });
            clsObserver.observe({ entryTypes: ['layout-shift'] });
        }

        // Lazy loading for images
        if ('IntersectionObserver' in window) {
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        if (img.dataset.src) {
                            img.src = img.dataset.src;
                            img.classList.remove('lazy');
                            observer.unobserve(img);
                        }
                    }
                });
            });

            // Observe all images with data-src attribute
            document.querySelectorAll('img[data-src]').forEach(img => {
                imageObserver.observe(img);
            });
        }

        // Keyboard navigation enhancements
        document.addEventListener('keydown', function(e) {
            // Tab navigation improvements
            if (e.key === 'Tab') {
                document.body.classList.add('keyboard-navigation');
            }

            // Escape key handling
            if (e.key === 'Escape') {
                // Close modals, clear focus, etc.
                const modal = document.querySelector('.app-modal[hidden="false"]');
                if (modal) {
                    modal.setAttribute('hidden', 'true');
                }
            }

            // High contrast mode toggle (Ctrl+Shift+H)
            if (e.ctrlKey && e.shiftKey && e.key === 'H') {
                e.preventDefault();
                toggleHighContrast();
            }
        });

        // Remove keyboard navigation class when mouse is used
        document.addEventListener('mousedown', function() {
            document.body.classList.remove('keyboard-navigation');
        });

        // High contrast mode function
        function toggleHighContrast() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme') || 'dark';

            if (currentTheme === 'high-contrast') {
                // Switch back to previous theme or default
                const savedTheme = localStorage.getItem('previous-theme') || 'dark';
                body.setAttribute('data-theme', savedTheme);
                localStorage.setItem('theme', savedTheme);
                showNotification('High contrast mode disabled', 'info');
            } else {
                // Save current theme and switch to high contrast
                localStorage.setItem('previous-theme', currentTheme);
                body.setAttribute('data-theme', 'high-contrast');
                showNotification('High contrast mode enabled', 'info');
            }
        }

        // Focus management for dynamic content
        function manageFocus(element) {
            if (element && typeof element.focus === 'function') {
                // Small delay to ensure element is rendered
                setTimeout(() => {
                    element.focus();
                    // Announce to screen readers
                    if ('speechSynthesis' in window) {
                        const announcement = element.getAttribute('aria-label') ||
                                           element.textContent ||
                                           'Content updated';
                        const utterance = new SpeechSynthesisUtterance(announcement);
                        utterance.volume = 0; // Silent, just for screen readers
                        speechSynthesis.speak(utterance);
                    }
                }, 100);
            }
        }

        // ARIA live regions for dynamic updates
        function updateLiveRegion(message, priority = 'polite') {
            const liveRegion = document.getElementById('live-region') ||
                             document.createElement('div');
            liveRegion.id = 'live-region';
            liveRegion.setAttribute('aria-live', priority);
            liveRegion.setAttribute('aria-atomic', 'true');
            liveRegion.className = 'sr-only';
            liveRegion.textContent = message;

            if (!document.getElementById('live-region')) {
                document.body.appendChild(liveRegion);
            }

            // Clear after announcement
            setTimeout(() => {
                liveRegion.textContent = '';
            }, 1000);
        }
    </script>
</body>

</html>
