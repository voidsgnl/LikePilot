<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b100d">
    <title>LikePilot · Sign in</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('brand_asset', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('brand_asset', filename='favicon-32x32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('brand_asset', filename='apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='console-theme.css') }}">
</head>
<body class="auth-body">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-accent" aria-hidden="true"></div>

            <header class="login-header">
                <a class="auth-brand-lockup" href="/login" aria-label="LikePilot home">
                    <span class="auth-brand-mark" aria-hidden="true">
                        <img src="{{ url_for('brand_asset', filename='192x192.png') }}" class="auth-brand-image" alt="">
                    </span>
                    <span class="auth-brand-title">LikePilot</span>
                </a>
                <span class="auth-status"><span class="auth-status-dot"></span> WORKSPACE ACCESS</span>
            </header>

            <div class="login-intro">
                <p class="login-eyebrow">WELCOME BACK</p>
                <h1 class="card-title" id="login-title">Sign in to continue<span>.</span></h1>
                <p class="login-subtitle">Access your automation workspace.</p>
            </div>

            {% if error %}
            <div class="error-msg" role="alert">
                <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"></circle><path d="M10 6v4.5M10 13.5h.01"></path></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" class="auth-form">
                <div class="auth-field">
                    <label class="auth-label" for="username">Username</label>
                    <div class="auth-input-wrap">
                        <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.5-3.4 3.1-5.2 7-5.2s6.5 1.8 7 5.2"></path></svg>
                        <input class="auth-input" id="username" type="text" name="username" required autocomplete="username" autofocus placeholder="Enter your username">
                    </div>
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="password">Password</label>
                    <div class="auth-input-wrap">
                        <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
                        <input class="auth-input auth-password-input" id="password" type="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                        <button class="password-toggle" type="button" id="password-toggle" aria-label="Show password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                        </button>
                    </div>
                </div>
                <button class="auth-button" type="submit">
                    <span>Sign in</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
                </button>
            </form>

            <footer class="login-footer">
                <span class="footer-lock" aria-hidden="true">
                    <svg viewBox="0 0 20 20"><rect x="4" y="8.5" width="12" height="9" rx="2"></rect><path d="M6.5 8.5V6a3.5 3.5 0 0 1 7 0v2.5"></path></svg>
                </span>
                <span>Private workspace</span>
                <span class="footer-divider"></span>
                <span>Authorized access only</span>
            </footer>
        </section>
        <div class="login-copyright">LIKEPILOT <span>·</span> CONTROL WORKSPACE</div>
    </main>
    <script>
        (() => {
            const input = document.getElementById('password');
            const toggle = document.getElementById('password-toggle');
            toggle.addEventListener('click', () => {
                const reveal = input.type === 'password';
                input.type = reveal ? 'text' : 'password';
                toggle.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
                toggle.setAttribute('aria-pressed', String(reveal));
            });
        })();
    </script>
</body>
</html>
