<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikePilot · Sign in</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('brand_asset', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('brand_asset', filename='favicon-32x32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('brand_asset', filename='apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='console-theme.css') }}">
</head>
<body class="auth-body">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <div class="auth-brand-lockup">
                <div class="auth-brand-mark" aria-hidden="true">
                    <img src="{{ url_for('brand_asset', filename='192x192.png') }}" class="auth-brand-image" alt="">
                </div>
                <div class="auth-brand-title">LikePilot</div>
            </div>
            <form method="POST" class="auth-form">
                <h1 class="card-title" id="login-title">Sign in</h1>
                <div>
                    <label class="auth-label" for="username">Username</label>
                    <input class="auth-input" id="username" type="text" name="username" required autocomplete="username" autofocus>
                </div>
                <div>
                    <label class="auth-label" for="password">Password</label>
                    <input class="auth-input" id="password" type="password" name="password" required autocomplete="current-password">
                </div>
                <button class="auth-button" type="submit">Sign in</button>
            </form>
            {% if error %}
            <div class="error-msg" role="alert">{{ error }}</div>
            {% endif %}
        </section>
    </main>
</body>
</html>
